<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Brain Bites</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='30' cy='34' r='26' fill='%23FF8A65' stroke='%231F2933' stroke-width='4'/%3E%3Ccircle cx='54' cy='14' r='12' fill='%23FFF6E5'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #fff6e5;
        overflow: hidden;
        touch-action: none;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #fff6e5;
        color: #1f2933;
        font: 700 28px Nunito, system-ui, sans-serif;
        text-align: center;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        padding: 0 32px;
      }
      #rotate .phone {
        width: 70px;
        height: 120px;
        border: 6px solid #1f2933;
        border-radius: 16px;
        background: #ff8a65;
        animation: turn 2s ease-in-out infinite;
      }
      @keyframes turn {
        0%, 30% { transform: rotate(0); }
        60%, 100% { transform: rotate(-90deg); }
      }
      /* Landscape game: on touch devices held upright, ask to turn the device. */
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate" role="alert">
      <div class="phone" aria-hidden="true"></div>
      <div>Turn your device sideways to play</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
